name: CI

# A gated pipeline, cheapest first: lint → conformance → unit → integration → python → compose →
# images.
# Every job needs the one before it, so a type error never spends minutes waiting for a database,
# and only a push to main that passed all of them publishes `sha-` images to GHCR.
#
# GitHub-hosted runners only: this repo is public, and a self-hosted runner would execute any fork's
# pull request. Every action is pinned to a commit SHA, never a tag: a tag is a mutable pointer, and
# an action that moves under you is a supply-chain compromise with your own credentials. The SHAs
# are the ones Foreman and Postroom already pin.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  # The schema/conformance layer (foreman://FLR/test_strategy#layers): the Floorspec conformance
  # suite, vendored in packages/engine/standard and pinned to a floorspec commit (FLR-ADR-009).
  conformance:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The vendored standard must be exactly floorspec at the commit LOCK.json pins, so the suite
      # can never drift silently. A sync made with --allow-dirty has no commit to check against.
      - name: Read the pinned floorspec commit
        id: pin
        run: |
          lock=packages/engine/standard/LOCK.json
          if [ "$(jq -r .dirty "$lock")" != "false" ]; then
            echo "::error::$lock records a dirty sync; re-run sync-standard against a clean floorspec commit"
            exit 1
          fi
          echo "commit=$(jq -r .commit "$lock")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: matdemers1/floorspec
          ref: ${{ steps.pin.outputs.commit }}
          path: .floorspec-pinned
          persist-credentials: false
      - name: The vendored standard matches the pinned commit
        run: |
          status=0
          for p in $(jq -r '.paths[]' packages/engine/standard/LOCK.json); do
            diff -r ".floorspec-pinned/$p" "packages/engine/standard/$p" || status=1
          done
          exit $status
      - name: The generated types and validator match the vendored schema
        run: pnpm --filter @floorspec/engine check:generated
      - name: Conformance suite (Node)
        run: pnpm conformance
      - name: Install Chromium for the browser runner
        run: pnpm --filter @floorspec/engine exec playwright install --with-deps chromium
      - name: Engine tests and conformance suite in the browser
        run: pnpm --filter @floorspec/engine test:browser

  unit:
    needs: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  integration:
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: floorspec
          POSTGRES_PASSWORD: floorspec
          POSTGRES_DB: floorspec
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U floorspec -d floorspec"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # The suite refuses to run against a database whose name does not end in _test, and creates
      # and migrates this one itself.
      DATABASE_URL: postgresql://floorspec:floorspec@127.0.0.1:5432/floorspec_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration drift check — schema.prisma and migrations/ must agree
        working-directory: apps/server
        env:
          SHADOW_DATABASE_URL: postgresql://floorspec:floorspec@127.0.0.1:5432/shadow
        run: |
          PGPASSWORD=floorspec psql -h 127.0.0.1 -U floorspec -d floorspec -c 'CREATE DATABASE shadow;'
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
      - name: prisma migrate deploy
        working-directory: apps/server
        run: |
          PGPASSWORD=floorspec psql -h 127.0.0.1 -U floorspec -d floorspec -c 'CREATE DATABASE floorspec_test;'
          pnpm exec prisma migrate deploy
      - run: pnpm test:integration

  python:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install
        working-directory: workers/ifc
        run: pip install -e '.[dev]'
      - name: pytest
        working-directory: workers/ifc
        run: python -m pytest -q

  # Compose is what runs on the host, so the images are built the way they will be built there and
  # the stack is booted on an empty database: the api migrates on boot and answers /health with
  # the schema revision Shipyard will check.
  compose:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # First, so the failure and cleanup steps below always find the dev env files they name.
      - name: Development env files
        run: ./deploy/dev-env.sh
      - name: No host ports and no interpolation in the production compose files
        run: |
          if grep -nE '^\s+(ports|published):' deploy/compose.yml deploy/compose.tunnel.yml; then
            echo 'deploy/compose.yml publishes a port; ingress is the Cloudflare Tunnel only' >&2
            exit 1
          fi
          # Comments may mention the rule; only YAML lines count.
          if grep -nE '^[^#]*\$\{' deploy/compose.yml deploy/compose.tunnel.yml; then
            echo 'deploy/compose.yml interpolates a variable; ZimaOS and Shipyard need literals' >&2
            exit 1
          fi
      - name: Boot the stack on an empty database
        run: |
          docker compose -f deploy/compose.yml -f deploy/compose.dev.yml up -d --build --wait
          curl -fsS http://127.0.0.1:3400/health | tee health.json
          grep -q '"schemaRevision":"[0-9]\{14\}_' health.json
      - name: Show the logs when something failed
        if: failure()
        run: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml logs
      - name: Stop
        if: always()
        run: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml down -v

  # The only job that publishes, and only from main once everything above is green. Tagged by long
  # SHA (`sha-<40 hex>`, the tag Shipyard resolves), labelled with the revision, schema and
  # migration kind Shipyard verifies before and after a swap. The web editor is not its own image:
  # the api serves it, as Foreman's server serves its console (one origin, one cookie, no CORS).
  images:
    needs: compose
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: .
            file: apps/server/Dockerfile
          - image: worker
            context: .
            file: apps/worker/Dockerfile
          - image: ifc-worker
            context: workers/ifc
            file: workers/ifc/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Schema and migration labels
        id: labels
        run: |
          schema=$(ls apps/server/prisma/migrations | grep -E '^[0-9]{14}_' | sort | tail -1)
          migration=$(git log -1 --format='%(trailers:key=Shipyard-Migration,valueonly)' | head -1 | tr -d '[:space:]')
          echo "schema=${schema}" >> "$GITHUB_OUTPUT"
          echo "migration=${migration:-none}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
          # metadata-action already writes org.opencontainers.image.revision=<sha>; it is repeated
          # here so the label Shipyard's success check depends on is visible in this file.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            dev.d3cloud.shipyard.migration=${{ steps.labels.outputs.migration }}
            ${{ matrix.image == 'api' && format('dev.d3cloud.shipyard.schema={0}', steps.labels.outputs.schema) || '' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # The Zima host is x86_64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
