# D3 Floorspec — the production stack on the Zima, deployed by Shipyard (deploy/shipyard.yml).
#
# Literal values only: no `${…}` anywhere. ZimaOS cannot read interpolation, and Shipyard rewrites
# each mapped service's `image:` line to `<repo>:sha-<40 hex>` itself and refuses to reason about a
# value it did not put there. The `sha-0000…` tags below are placeholders: at onboarding they are
# replaced with the SHA actually running (shipyard docs/runbooks/onboard-app.md §3).
#
# No host ports: ingress is the Cloudflare Tunnel overlay (compose.tunnel.yml) only. Secrets come
# from env files at absolute paths on the host, never from this file:
#   /DATA/floorspec/postgres.env  POSTGRES_USER=floorspec, POSTGRES_PASSWORD=<random>, POSTGRES_DB=floorspec
#   /DATA/floorspec/api.env       PUBLIC_URL=https://floorspec.d3cloud.io
#                                 DATABASE_URL=postgresql://floorspec:<same password>@postgres:5432/floorspec
#                                 KEK=<openssl rand -base64 32>   PEPPER=<openssl rand -base64 32>
#                                 D3AUTH_ISSUER=https://auth.d3cloud.io  D3AUTH_CLIENT_ID=…  D3AUTH_CLIENT_SECRET=…
#                                 MAIL_RELAY_URL=<D3 Auth's mail relay>  MAIL_RELAY_TOKEN=…  ALERT_TO=<operator>
#                                   (optional, all three or none: alert email, FLR-T-12.2; the
#                                   worker reads them too, for its health watchdog)
#   /DATA/floorspec/tunnel.env    TUNNEL_TOKEN=<the floorspec tunnel's token>
#
# Uploaded textures live in the `assets` volume, files named by their SHA-256 (FLR-T-8.2).
#
# The api migrates on boot, after a pre-migration pg_dump into the backups volume. The editor is
# served by the api: there is no separate web container. The api also takes the nightly backup into
# that volume and runs the weekly restore drill (FLR-T-12.1, docs/runbooks/restore.md); the worker
# watches the api's /health and the database and emails the operator when they fail (FLR-T-12.2).
name: floorspec

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - /DATA/floorspec/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floorspec -d floorspec"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/matdemers1/d3-floorspec/api:sha-0000000000000000000000000000000000000000
    restart: unless-stopped
    env_file:
      - /DATA/floorspec/api.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backups:/backups
      # Uploaded textures, content-addressed (FLR-T-8.2); the image sets ASSET_DIR=/assets, and the
      # nightly backup mirrors it into the backups volume.
      - assets:/assets
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  worker:
    image: ghcr.io/matdemers1/d3-floorspec/worker:sha-0000000000000000000000000000000000000000
    restart: unless-stopped
    env_file:
      - /DATA/floorspec/api.env
    depends_on:
      postgres:
        condition: service_healthy
    # Its healthcheck is the image's own: the heartbeat file must be younger than two minutes.

  ifc-worker:
    image: ghcr.io/matdemers1/d3-floorspec/ifc-worker:sha-0000000000000000000000000000000000000000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "floorspec_ifc", "health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pgdata: {}
  backups: {}
  assets: {}
